[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "trace_editor"
dynamic = ["version"]
description = "Trace editor for force spectroscopy data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lmfit>=1.3.2",
    "matplotlib>=3.10.0",
    "numpy>=2.2.1",
    "pandas>=2.2.3",
    "scipy>=1.15.1",
    "tweezepy>=1.2.7",
    "setuptools<81",
    "numba>=0.63.1",
    "pyside6>=6.11.1",
    "h5py>=3.16.0",
    "jupytext>=1.19.4",
    "tables>=3.10.2",
    "qt-material>=2.17",
]

[project.optional-dependencies]
oldhdf = [
    "icecream>=2.1.4",
    "keyboard>=0.13.5",
    "npTDMS>=1.9.0",
    "seaborn>=0.13.2",
    "svgwrite>=1.4.3",
    "tqdm>=4.67.1",
]
test = [
    "pytest>=8.0.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
]
docs = [
    "pydoc-markdown>=4.8.2",
]

[project.scripts]
trace_editor = "trace_editor.gui.main_window:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_editor"]

[tool.jupytext.formats]
"notebooks/" = "ipynb"
"nb_scripts/" = "py:percent"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "gui: GUI tests that require QApplication",
    "io: File I/O tests",
    "fitting: Fitting algorithm tests",
    "workflow: Full analysis-workflow integration tests",
    "slow: slow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::tables.exceptions.NaturalNameWarning",
]

